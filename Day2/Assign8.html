
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Listing</title>
    <link rel="stylesheet" href="products.css">
</head>
<body>
    <header>
        <h1>My Store</h1>
        <p>Explore our products</p>
    </header>

    <main class="product-container">
        <article class="product-card">
            <img src="https://placehold.co/300x200?text=Headphones" alt="Headphones">
            <h2>Headphones</h2>
            <p>High-quality sound for everyday use.</p>
            <p class="price">₹999</p>
            <button type="button">View Product</button>
        </article>

        <article class="product-card">
            <img src="https://placehold.co/300x200?text=Watch" alt="Wristwatch">
            <h2>Wristwatch</h2>
            <p>A stylish watch for everyday wear.</p>
            <p class="price">₹1,499</p>
            <button type="button">View Product</button>
        </article>

        <article class="product-card">
            <img src="https://placehold.co/300x200?text=Shoes" alt="Shoes">
            <h2>Shoes</h2>
            <p>Comfortable shoes for daily activities.</p>
            <p class="price">₹1,999</p>
            <button type="button">View Product</button>
        </article>
    </main>
</body>
</html>
