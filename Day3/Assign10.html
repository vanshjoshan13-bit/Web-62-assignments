
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of beautiful places</p>
    </header>

    <main class="gallery">
        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=800&q=80" alt="Mountain landscape">
            <figcaption>Mountains</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Beautiful beach">
            <figcaption>Beach</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=800&q=80" alt="Green forest">
            <figcaption>Forest</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80" alt="Mountain under a starry sky">
            <figcaption>Night Sky</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=800&q=80" alt="Lake surrounded by mountains">
            <figcaption>Lake</figcaption>
        </figure>

        <figure class="gallery-item">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=800&q=80" alt="Sunrise over a landscape">
            <figcaption>Sunrise</figcaption>
        </figure>
    </main>
</body>
</html>
