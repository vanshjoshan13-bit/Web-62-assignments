
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Landing Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7ff;
            color: #222;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background: white;
        }

        .logo {
            color: #4f46e5;
            font-size: 25px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 20px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #dbeafe, #ede9fe);
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 600px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .btn {
            background: #4f46e5;
            color: white;
            padding: 13px 25px;
            text-decoration: none;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 6px;
            }

            .hero h1 {
                font-size: 32px;
            }

            .hero p {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Creative</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>Build Your Dreams</h1>
        <p>
            Welcome to our creative world. Explore new ideas,
            learn new skills, and turn your dreams into reality.
        </p>
        <a href="#about" class="btn">Get Started</a>
    </section>

    <section id="about" style="padding: 40px 20px; text-align: center;">
        <h2>About Us</h2>
        <p style="margin-top: 15px;">
            We help people learn, create, and grow through technology.
        </p>
    </section>

    <footer id="contact">
        <p>&copy; 2026 Creative. All rights reserved.</p>
    </footer>

</body>
</html>
